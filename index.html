<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <div id="header">
        <h1>CHESS TOURNAMENT MAKER</h1>
    </div>
    <div id="playerList">
        <div class="playerRow">
            <input type="text" placeholder="Player's name" class="playerName"></textarea>
            <input type="number" placeholder="Elo rating" class="playerElo"></textarea>
        </div>
    </div>
    <div id="buttons">
        <button id="creaTurni">Pair</button>
        <button id="addRow">Add row</button>
        <button id="cancelAll">Cancel all</button>
    </div>
    <div id="results"></div>
    <div id="playerModal" class="modal hidden">
        <div class="modal-content">
            <span id="closeModal" class="close-button">&times;</span>
            <div id="playerDetails"></div>
        </div>
</div>

    
    <script src="script.js" defer></script>
</body>
</html>
